# The collector on this machine, with Docker and nothing else installed: a Postgres server, the
# migrations, then one run. It reads Stellar mainnet and sends no transaction.
#
#   docker compose run --rm --build --quiet-build collector   # one run, stored in the local server
#   docker compose down --volumes                             # remove the server and its data
name: fairfx

x-collector: &collector
  image: fairfx-collector
  build:
    context: .
    dockerfile: deploy/collector/Dockerfile
  environment:
    # The password of this throwaway server. A real database keeps its URL out of the repo.
    DATABASE_URL: postgres://postgres:local@postgres:5432/fairfx

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: fairfx
      POSTGRES_PASSWORD: local
    # Open on this machine only. 5433 leaves 5432 free for a Postgres you may already run.
    ports: ['127.0.0.1:5433:5432']
    volumes: ['postgres:/var/lib/postgresql']
    healthcheck:
      # Asked over TCP: the socket answers earlier, while the server is still being set up.
      test: [CMD, pg_isready, --host, 127.0.0.1, --username, postgres, --dbname, fairfx]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    <<: *collector
    command:
      - node
      - packages/db/node_modules/node-pg-migrate/bin/node-pg-migrate.js
      - up
      - --migrations-dir
      - packages/db/migrations
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    <<: *collector
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres:
