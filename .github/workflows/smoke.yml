name: smoke

# Reads the live networks once a night. Nothing here signs or submits a transaction. A pull request
# that changes this file runs it too, so a change to the smoke run is tried before it merges.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/smoke.yml]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    uses: ./.github/workflows/pnpm.yml
    with:
      run: pnpm test:smoke

  collector:
    name: one collector run on mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/fairfx
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: fairfx
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - run: docker build --file deploy/collector/Dockerfile --tag fairfx-collector .

      - name: apply the migrations with the image
        run: >-
          docker run --rm --network host --env DATABASE_URL fairfx-collector
          node packages/db/node_modules/node-pg-migrate/bin/node-pg-migrate.js
          up --migrations-dir packages/db/migrations

      - name: the run is written
        run: |
          docker run --rm --network host --env DATABASE_URL fairfx-collector | tee run.log
          jq --exit-status '.event == "run" and .outcome == "written"' run.log > /dev/null

      - name: all three tables have rows
        env:
          POSTGRES: ${{ job.services.postgres.id }}
          COUNT_ROWS: >-
            SELECT (SELECT count(*) FROM run),
                   (SELECT count(*) FROM reference_sample),
                   (SELECT count(*) FROM quote_sample)
        run: |
          rows=$(docker exec "$POSTGRES" psql --username postgres --dbname fairfx --tuples-only --no-align --command "$COUNT_ROWS")
          echo "run|reference_sample|quote_sample: $rows"
          [[ "$rows" =~ ^[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*$ ]]
