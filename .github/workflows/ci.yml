name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Stage 1 (checks) runs in parallel. Stage 2 (test) starts when every check passed.
# The steps live in the template-*.yml workflows.
jobs:
  # Stage 1: checks
  secrets:
    uses: ./.github/workflows/template-gitleaks.yml

  audit:
    uses: ./.github/workflows/template-pnpm.yml
    with:
      run: pnpm audit --audit-level high

  lint:
    uses: ./.github/workflows/template-pnpm.yml
    with:
      run: pnpm lint

  typecheck:
    uses: ./.github/workflows/template-pnpm.yml
    with:
      run: pnpm typecheck

  deps:
    uses: ./.github/workflows/template-pnpm.yml
    with:
      run: pnpm deps

  # Stage 2: test
  test:
    needs: [secrets, audit, lint, typecheck, deps]
    uses: ./.github/workflows/template-pnpm.yml
    with:
      run: pnpm test
      timeout-minutes: 15
