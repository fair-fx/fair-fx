name: ci

on:
  pull_request:
  push:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    uses: ./.github/workflows/gitleaks.yml

  repo:
    uses: ./.github/workflows/pnpm.yml
    with:
      run: pnpm check:repo

  test:
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [core, venues, db, collector]
    uses: ./.github/workflows/pnpm.yml
    with:
      run: pnpm --filter @fair-fx/${{ matrix.package }} test

  image:
    name: collector image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - run: docker build --file deploy/collector/Dockerfile --tag fairfx-collector .

      - name: the image starts and refuses to run without a database
        run: |
          docker run --rm fairfx-collector 2> run.log || true
          cat run.log
          grep --quiet '"event":"run_failed".*DATABASE_URL' run.log

      - name: compose.yaml is valid
        run: docker compose config --quiet

  ci:
    if: always()
    needs: [secrets, repo, test, image]
    uses: ./.github/workflows/gate.yml
    with:
      results: ${{ toJSON(needs) }}
