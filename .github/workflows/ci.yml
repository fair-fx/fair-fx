name: ci

on:
  pull_request:
  push:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    uses: ./.github/workflows/gitleaks.yml

  typescript:
    uses: ./.github/workflows/pnpm.yml
    with:
      run: pnpm check
      timeout-minutes: 15
