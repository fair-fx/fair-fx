name: ci

on:
  pull_request:
  push:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    uses: ./.github/workflows/gitleaks.yml

  repo:
    uses: ./.github/workflows/pnpm.yml
    with:
      run: pnpm check:repo

  test:
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [core, venues, db, collector]
    uses: ./.github/workflows/pnpm.yml
    with:
      run: pnpm --filter @fair-fx/${{ matrix.package }} test

  ci:
    if: always()
    needs: [secrets, repo, test]
    uses: ./.github/workflows/gate.yml
    with:
      results: ${{ toJSON(needs) }}
