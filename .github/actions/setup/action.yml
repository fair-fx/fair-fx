name: setup
description: Install Node and pnpm from the versions pinned in the repo, then install dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile
